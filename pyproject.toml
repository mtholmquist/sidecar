[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sidecar"
version = "1.1.0"
description = "Sidecar: decoupled AI copilot for pentesting/CTFs"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "sidecar", email = "noreply@example.com" }]

dependencies = [
  "pydantic>=2.13.4",
  "pyyaml>=6.0.3",
  "rich>=15.0.0",
  "beautifulsoup4>=4.15.0",
  "lxml>=6.1.1",
  "tqdm>=4.68.4",
  "requests>=2.34.2",
  "orjson>=3.11.9",
  "textual>=8.2.8",
  "openai>=2.44.0",
  "anthropic>=0.116.0",
  "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.2",
]

[project.scripts]
sidecar = "sidecar.cli:main"

[tool.setuptools]
# We are using a flat layout; package code lives in ./sidecar
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["sidecar*"]
exclude = ["samples*", "notes*"]
